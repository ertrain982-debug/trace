<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E0E10" id="tc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>ARt</title>
<style>
  :root[data-theme="dark"]{
    --bg:#0E0E10; --card:#1A1A1D; --ink:#ECEAE6; --dim:#807D77;
    --line:rgba(255,255,255,.11); --sunk:rgba(255,255,255,.05);
  }
  :root[data-theme="light"]{
    --bg:#F4F2ED; --card:#FFFFFF; --ink:#1B1A17; --dim:#8A857C;
    --line:rgba(0,0,0,.11); --sunk:rgba(0,0,0,.045);
  }
  :root{ --hot:#E8B84B; --ok:#5FB88B; --tap:52px;
         --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom) }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:500 14px/1.35 system-ui,-apple-system,sans-serif;overscroll-behavior:none}
  body{overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;padding:0}
  button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}

/* ============ БИБЛИОТЕКА ============ */
  #head{padding:calc(14px + var(--top)) 16px 12px;display:flex;align-items:center;gap:12px}
  #head h1{margin:0;font-size:21px;font-weight:650;letter-spacing:-.01em;flex:1}
  .ico{width:40px;height:40px;border-radius:12px;background:var(--sunk);
    display:grid;place-items:center;font-size:17px;flex:none}
  .ico:active{background:var(--line)}

  #tabs{display:flex;gap:7px;padding:0 16px 12px}
  #tabs button{padding:8px 15px;border-radius:99px;background:var(--sunk);
    color:var(--dim);font-size:13px;font-weight:600}
  #tabs button.on{background:var(--ink);color:var(--bg)}

  #grid{flex:1;overflow-y:auto;padding:0 16px calc(96px + var(--bot));
    display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    gap:12px;align-content:start;-webkit-overflow-scrolling:touch}

  .card{position:relative;border-radius:14px;overflow:hidden;background:var(--card);
    border:1px solid var(--line);aspect-ratio:3/4}
  .card img{width:100%;height:100%;object-fit:cover;display:block;
    background:#fff;transition:opacity .15s}
  .card.done img{opacity:.34}
  .card:active{transform:scale(.975);transition:transform .1s}

  .badge{position:absolute;top:7px;width:31px;height:31px;border-radius:50%;
    display:grid;place-items:center;font-size:14px;line-height:1;
    background:rgba(10,10,12,.62);backdrop-filter:blur(6px);color:#fff}
  .badge.f{right:7px}
  .badge.d{right:44px}
  .badge.on{background:var(--hot);color:#17150F}
  .badge.d.on{background:var(--ok);color:#0C1F16}

  .name{position:absolute;left:0;right:0;bottom:0;padding:16px 9px 7px;font-size:11px;
    color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.78));
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #empty{grid-column:1/-1;text-align:center;color:var(--dim);
    padding:64px 24px;line-height:1.7;font-size:13px}

  #add{position:fixed;right:16px;bottom:calc(20px + var(--bot));
    height:56px;padding:0 24px;border-radius:28px;background:var(--hot);color:#17150F;
    font-weight:650;font-size:15px;display:flex;align-items:center;gap:8px;
    box-shadow:0 6px 22px rgba(0,0,0,.34)}
  #add:active{transform:scale(.96)}

/* ============ ОБВОДКА ============ */
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #paper{position:fixed;inset:0;display:none;place-items:center;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.045) 0 1px,transparent 1px 26px),
      radial-gradient(120% 90% at 50% 30%,#F2EFE7,#D9D4C6 65%,#A8A296);
    color:rgba(0,0,0,.3);font-size:11px;letter-spacing:.15em;text-transform:uppercase}
  #paper.on{display:grid}

  #stage{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden}
  #art{max-width:100vw;max-height:100vh;transform-origin:center;will-change:transform;opacity:.5}
  #art.lines{filter:grayscale(1) contrast(2.4) brightness(1.08)}
  #art.inv{filter:invert(1) grayscale(1) contrast(2.4)}

  #grab{position:fixed;inset:0;touch-action:none}
  #grab.locked{pointer-events:none}

  #back{position:fixed;top:calc(10px + var(--top));left:12px;width:44px;height:44px;
    border-radius:50%;background:rgba(10,10,12,.62);backdrop-filter:blur(10px);
    color:#fff;display:grid;place-items:center;font-size:20px}

  #pin{position:fixed;top:calc(16px + var(--top));left:50%;transform:translateX(-50%);
    padding:6px 14px;border-radius:14px;background:rgba(232,184,75,.92);color:#17150F;
    display:none;font-size:12px;font-weight:600}
  #pin.on{display:block}

  /* панель обводки всегда тёмная: светлая слепит и сбивает экспозицию камеры */
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + var(--bot));
    background:rgba(20,20,22,.84);backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.12);color:#ECEAE6;
    display:flex;flex-direction:column;gap:9px;transition:transform .22s ease}
  #bar.hid{transform:translateY(112%)}
  @media (prefers-reduced-motion:reduce){#bar,.card{transition:none}}

  .row{display:flex;gap:8px;align-items:center}
  #bar .row button{flex:1;min-height:var(--tap);border-radius:10px;font-size:13px;
    border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);
    display:grid;place-items:center;padding:0 4px}
  #bar .row button:active{background:rgba(255,255,255,.15)}
  #bar .row button.on{background:var(--hot);border-color:var(--hot);color:#17150F}
  #bar .row button:disabled{opacity:.3}
  input[type=range]{flex:1;height:var(--tap);accent-color:var(--hot);background:none}
  .val{width:44px;color:#8A8781;font-variant-numeric:tabular-nums;text-align:right;font-size:12px}

  #tab{position:fixed;bottom:calc(8px + var(--bot));left:50%;transform:translateX(-50%);
    width:100px;height:34px;border-radius:17px;background:rgba(20,20,22,.84);
    border:1px solid rgba(255,255,255,.12);color:#8A8781;display:none;place-items:center;
    backdrop-filter:blur(14px);font-size:12px}
  #tab.on{display:grid}

  #toast{position:fixed;left:50%;bottom:calc(96px + var(--bot));transform:translate(-50%,14px);
    background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;max-width:84vw;text-align:center;z-index:50}
  #toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- ЭКРАН 1: библиотека -->
<section id="lib" class="screen on">
  <div id="head">
    <h1>ARt</h1>
    <button class="ico" id="theme" aria-label="Сменить тему">◐</button>
  </div>
  <div id="tabs">
    <button data-f="all" class="on">Все</button>
    <button data-f="fav">★ Избранное</button>
    <button data-f="done">Готово</button>
  </div>
  <div id="grid"></div>
  <button id="add">＋ Добавить</button>
</section>

<!-- ЭКРАН 2: обводка -->
<section id="draw" class="screen">
  <video id="cam" playsinline muted autoplay></video>
  <div id="paper"><span>демо-режим, камеры нет</span></div>
  <div id="stage"><img id="art" alt=""></div>
  <div id="grab"></div>
  <button id="back" aria-label="Назад в библиотеку">‹</button>
  <div id="pin">Зафиксировано</div>
  <div id="bar">
    <div class="row">
      <input id="op" type="range" min="5" max="100" value="50" aria-label="Прозрачность">
      <span class="val" id="opv">50%</span>
    </div>
    <div class="row">
      <button id="lock">Зафиксировать</button>
      <button id="torch" disabled>Фонарик</button>
      <button id="fit">Сброс</button>
    </div>
    <div class="row">
      <button id="lines">Линии</button>
      <button id="inv">Инверсия</button>
      <button id="fav2">★ В избранное</button>
      <button id="hide">Скрыть</button>
    </div>
  </div>
  <button id="tab">Панель</button>
</section>

<div id="toast"></div>
<input id="file" type="file" accept="image/*" multiple hidden>

<script>
const $ = id => document.getElementById(id);
let toastT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2600);
}

/* ========== ХРАНИЛИЩЕ (IndexedDB) ==========
   Эскизы лежат на телефоне, не на сервере. Очистка данных Chrome их сотрёт. */
let db;
const open = () => new Promise((res, rej) => {
  const r = indexedDB.open('trace', 1);
  r.onupgradeneeded = () => {
    const d = r.result;
    if(!d.objectStoreNames.contains('sk'))   d.createObjectStore('sk', {keyPath:'id'});
    if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
  };
  r.onsuccess = () => res(r.result);
  r.onerror   = () => rej(r.error);
});
const st  = (s, m='readonly') => db.transaction(s, m).objectStore(s);
const rq  = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

const allSk  = ()      => rq(st('sk').getAll());
const putSk  = o       => rq(st('sk','readwrite').put(o));
const delSk  = id      => rq(st('sk','readwrite').delete(id));
const getM   = k       => rq(st('meta').get(k));
const setM   = (k,v)   => rq(st('meta','readwrite').put(v,k));

/* ========== ТЕМА ========== */
async function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $('tc').content = t === 'dark' ? '#0E0E10' : '#F4F2ED';
  await setM('theme', t);
}
$('theme').onclick = () =>
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ========== БИБЛИОТЕКА ========== */
let items = [], filter = 'all', urls = [];

async function thumb(file, max = 420){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close();
  return new Promise(r => c.toBlob(r, 'image/jpeg', .82));
}

async function load(){ items = await allSk(); items.sort((a,b) => b.added - a.added); draw(); }

function draw(){
  urls.forEach(URL.revokeObjectURL); urls = [];
  const g = $('grid'); g.innerHTML = '';
  const list = items.filter(i => filter === 'all' || (filter === 'fav' ? i.fav : i.done));

  if(!list.length){
    g.innerHTML = '<p id="empty">' + (
      filter === 'all' ? 'Пусто. Нажми «Добавить» и загрузи свои эскизы —<br>они останутся в приложении.'
    : filter === 'fav' ? 'Здесь будут эскизы, отмеченные звездой.'
    :                    'Здесь будут эскизы, отмеченные галочкой.'
    ) + '</p>';
    return;
  }

  for(const it of list){
    const u = URL.createObjectURL(it.thumb); urls.push(u);
    const c = document.createElement('div');
    c.className = 'card' + (it.done ? ' done' : '');
    c.innerHTML =
      `<img src="${u}" alt="">
       <button class="badge d ${it.done?'on':''}" aria-label="Отметить готовым">✓</button>
       <button class="badge f ${it.fav ?'on':''}" aria-label="В избранное">★</button>
       <div class="name">${it.name.replace(/[<>&]/g,'')}</div>`;

    c.querySelector('.f').onclick = async e => { e.stopPropagation(); it.fav = !it.fav;  await putSk(it); draw(); };
    c.querySelector('.d').onclick = async e => { e.stopPropagation(); it.done = !it.done; await putSk(it); draw(); };
    c.onclick = () => openDraw(it);

    let hold;
    const start = () => hold = setTimeout(async () => {
      if(confirm(`Удалить «${it.name}»?`)){
        await delSk(it.id); items = items.filter(x => x.id !== it.id); draw(); toast('Удалено');
      }
    }, 550);
    const stop = () => clearTimeout(hold);
    c.addEventListener('pointerdown', start);
    ['pointerup','pointerleave','pointercancel','pointermove'].forEach(ev => c.addEventListener(ev, stop));

    g.appendChild(c);
  }
}

$('tabs').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  filter = b.dataset.f;
  [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b));
  draw();
};

$('add').onclick = () => $('file').click();
$('file').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if(!files.length) return;
  let n = 0;
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    try{
      await putSk({
        id: crypto.randomUUID(), name: f.name.replace(/\.[^.]+$/, '').slice(0, 40),
        blob: f, thumb: await thumb(f), added: Date.now(), fav: false, done: false
      });
      n++;
    }catch(err){ toast('Не удалось: ' + f.name); }
  }
  await load();
  if(n) toast(n === 1 ? 'Добавлен эскиз' : `Добавлено: ${n}`);
};

/* ========== ЭКРАН ОБВОДКИ ========== */
const cam = $('cam'), art = $('art'), grab = $('grab'), bar = $('bar');
let track = null, current = null, camOn = false;

async function startCam(){
  if(camOn) return;
  try{
    const s = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }, audio:false
    });
    cam.srcObject = s;
    track = s.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    $('torch').disabled = !caps.torch;
    camOn = true;
  }catch(e){
    $('paper').classList.add('on');
    toast(e.name === 'NotAllowedError'
      ? 'Камера запрещена. Разреши её для сайта в Chrome.'
      : 'Камера недоступна: ' + e.name);
  }
}

let wake = null;
const keepAwake = async () => { try{ wake = await navigator.wakeLock.request('screen'); }catch(e){} };
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && $('draw').classList.contains('on')) keepAwake();
});

function show(id){
  $('lib').classList.toggle('on', id === 'lib');
  $('draw').classList.toggle('on', id === 'draw');
}

let artUrl = null;
async function openDraw(it){
  current = it;
  if(artUrl) URL.revokeObjectURL(artUrl);
  artUrl = URL.createObjectURL(it.blob);
  art.src = artUrl;
  T.x = T.y = T.r = 0; T.s = 1; render();
  $('fav2').classList.toggle('on', !!it.fav);
  show('draw');
  history.pushState({draw:1}, '');
  keepAwake();
  startCam();
}

function closeDraw(){
  show('lib');
  if(wake){ wake.release().catch(()=>{}); wake = null; }
  load();
}
$('back').onclick = () => history.state?.draw ? history.back() : closeDraw();
addEventListener('popstate', () => { if($('draw').classList.contains('on')) closeDraw(); });

/* --- жесты --- */
const T = {x:0, y:0, s:1, r:0};
const pts = new Map();
let base = null, locked = false;
const render = () => art.style.transform = `translate(${T.x}px,${T.y}px) rotate(${T.r}rad) scale(${T.s})`;

function shape(){
  const a = [...pts.values()];
  if(!a.length) return null;
  if(a.length === 1) return {cx:a[0].x, cy:a[0].y, d:null, ang:null};
  const [p,q] = a;
  return {cx:(p.x+q.x)/2, cy:(p.y+q.y)/2,
          d:Math.hypot(q.x-p.x, q.y-p.y), ang:Math.atan2(q.y-p.y, q.x-p.x)};
}
const rebase = () => { const s = shape(); base = s ? {s, T:{...T}} : null; };

grab.addEventListener('pointerdown', e => {
  grab.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); rebase();
});
grab.addEventListener('pointermove', e => {
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const s = shape(); if(!base || !s) return;
  if(s.d != null && base.s.d){
    T.s = Math.min(24, Math.max(.04, base.T.s * (s.d / base.s.d)));
    T.r = base.T.r + (s.ang - base.s.ang);
  }
  T.x = base.T.x + (s.cx - base.s.cx);
  T.y = base.T.y + (s.cy - base.s.cy);
  render();
});
const drop = e => { pts.delete(e.pointerId); rebase(); };
grab.addEventListener('pointerup', drop);
grab.addEventListener('pointercancel', drop);

/* --- кнопки --- */
$('op').oninput = e => { art.style.opacity = e.target.value/100; $('opv').textContent = e.target.value + '%'; };

$('lock').onclick = e => {
  locked = !locked;
  grab.classList.toggle('locked', locked);
  e.target.classList.toggle('on', locked);
  e.target.textContent = locked ? 'Разблокировать' : 'Зафиксировать';
  $('pin').classList.toggle('on', locked);
};

$('torch').onclick = async e => {
  const on = !e.target.classList.contains('on');
  try{ await track.applyConstraints({advanced:[{torch:on}]}); e.target.classList.toggle('on', on); }
  catch(err){ e.target.disabled = true; toast('Фонарик недоступен на этом телефоне'); }
};

$('lines').onclick = e => {
  art.classList.remove('inv'); $('inv').classList.remove('on');
  art.classList.toggle('lines'); e.target.classList.toggle('on', art.classList.contains('lines'));
};
$('inv').onclick = e => {
  art.classList.remove('lines'); $('lines').classList.remove('on');
  art.classList.toggle('inv'); e.target.classList.toggle('on', art.classList.contains('inv'));
};
$('fit').onclick = () => { T.x = T.y = T.r = 0; T.s = 1; render(); };

$('fav2').onclick = async e => {
  if(!current) return;
  current.fav = !current.fav;
  await putSk(current);
  e.target.classList.toggle('on', current.fav);
  toast(current.fav ? 'В избранном' : 'Убрано из избранного');
};

const panel = v => { bar.classList.toggle('hid', !v); $('tab').classList.toggle('on', !v); };
$('hide').onclick = () => panel(false);
$('tab').onclick  = () => panel(true);

/* ========== СТАРТ ========== */
(async () => {
  db = await open();
  await applyTheme((await getM('theme')) || 'dark');
  await load();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
